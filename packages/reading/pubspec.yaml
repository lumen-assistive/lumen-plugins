name: lumen_plugin_reading
description: >-
  Lumen Reading module (Italian: Leggere e Studiare): Italian syllable
  splitting and SM-2 spaced repetition flashcards, built on lumen_sdk.
version: 0.2.0
publish_to: none
repository: https://github.com/lumen-assistive/lumen-plugins/tree/main/packages/reading
issue_tracker: https://github.com/lumen-assistive/lumen-plugins/issues
homepage: https://github.com/lumen-assistive/lumen-plugins/tree/main/packages/reading

environment:
  sdk: ^3.5.0

dependencies:
  lumen_sdk:
    git:
      url: https://github.com/lumen-assistive/lumen-sdk.git
      ref: v0.1.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
