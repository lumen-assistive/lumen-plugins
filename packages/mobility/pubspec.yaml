name: lumen_plugin_mobility
description: >-
  Lumen Mobility module (Italian: Muoversi): proactive gait stability monitoring and
  a mobility aid profile, built on lumen_sdk.
version: 0.2.0
publish_to: none
repository: https://github.com/lumen-assistive/lumen-plugins/tree/main/packages/mobility
issue_tracker: https://github.com/lumen-assistive/lumen-plugins/issues
homepage: https://github.com/lumen-assistive/lumen-plugins/tree/main/packages/mobility

environment:
  sdk: ^3.5.0

dependencies:
  lumen_sdk:
    git:
      url: https://github.com/lumen-assistive/lumen-sdk.git
      ref: v0.1.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
